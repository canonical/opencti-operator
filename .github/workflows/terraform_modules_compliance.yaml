name: Terraform modules compliance

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-modules-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product", "terraform/product/modules/rabbitmq-server", "terraform/product/modules/redis-k8s", "terraform/product/modules/s3-integrator"]'
