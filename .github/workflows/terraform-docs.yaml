name: Update Terraform documentation

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-docs.yaml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-docs.yaml'

jobs:
  terraform-docs:
    name: Update Terraform documentation
    permissions:
      contents: write
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@3046da45237aa86dcdcd83c299e1380842b473cc # main
    secrets: inherit
    with:
      terraform-directory: terraform/charm,terraform/product,terraform/product/modules/rabbitmq-server,terraform/product/modules/s3-integrator
