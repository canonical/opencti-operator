name: Terraform modules release

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'

permissions:
  contents: write

jobs:
  terraform-charm-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main
    with:
      tag-prefix: tf-charm-
      major-version-file: terraform/charm/MAJOR_VERSION

  terraform-product-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main
    with:
      tag-prefix: tf-product-
      major-version-file: terraform/product/MAJOR_VERSION
