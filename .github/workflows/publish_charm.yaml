name: Publish to edge

on:
  push:
    branches:
    - main

jobs:
  publish:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@14b1cf49d48b9d5b96192d9bca2890c98b7295cf # v1.0.2
    permissions:
      actions: read
      contents: write
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
    with:
      integration-workflow-name: integration_test.yaml
  publish-charm-libs:
    name: Release charm libs
    runs-on: ubuntu-24.04
    needs: [publish]
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: canonical/charming-actions/release-libraries@2.7.0
      name: Release libs
      with:
        credentials: ${{ secrets.CHARMHUB_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
